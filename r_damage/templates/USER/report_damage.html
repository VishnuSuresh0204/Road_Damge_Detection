<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Road Damage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/dashboard">

            RoadGuard

        </a>


        <div>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">

                Dashboard

            </a>

            <a href="/my_reports"
               class="btn btn-outline-light">

                My Reports

            </a>

        </div>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <div class="card shadow-sm border-0">

                <div class="card-header bg-dark text-white">

                    <h4 class="mb-0">
                        Report Road Damage
                    </h4>

                </div>


                <div class="card-body p-4">


                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-{{ message.tags }}">

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}


                    <div class="alert alert-info">

                        Upload an image of the damaged road.
                        The report will be reviewed by an administrator.

                    </div>


                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}


                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Road Damage Image
                            </label>

                            <input type="file"
                                   name="image"
                                   class="form-control"
                                   accept="image/*"
                                   required>

                            <small class="text-muted">
                                Upload JPG, JPEG or PNG image.
                            </small>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea name="description"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Describe the road damage"></textarea>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Location Name
                            </label>

                            <input type="text"
                                   name="location_name"
                                   class="form-control"
                                   placeholder="Example: MG Road, Kochi">

                        </div>


                        <div class="row">


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Latitude
                                </label>

                                <input type="text"
                                       name="latitude"
                                       id="latitude"
                                       class="form-control"
                                       placeholder="Latitude">

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Longitude
                                </label>

                                <input type="text"
                                       name="longitude"
                                       id="longitude"
                                       class="form-control"
                                       placeholder="Longitude">

                            </div>


                        </div>


                        <button type="button"
                                class="btn btn-outline-dark mb-4"
                                onclick="getLocation()">

                            Get My Location

                        </button>


                        <div class="d-flex justify-content-between">

                            <a href="/dashboard"
                               class="btn btn-secondary">

                                Cancel

                            </a>


                            <button type="submit"
                                    class="btn btn-dark">

                                Submit Report

                            </button>

                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>

</div>


<script>

function getLocation() {

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(
            
            function(position) {

                document.getElementById("latitude").value =
                    position.coords.latitude;

                document.getElementById("longitude").value =
                    position.coords.longitude;

            },

            function(error) {

                alert("Unable to get your location.");

            }

        );

    } else {

        alert("Geolocation is not supported by your browser.");

    }

}

</script>


</body>
</html>
