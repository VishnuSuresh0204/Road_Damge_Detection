<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - RoadAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 420px;
            border: none;
            border-radius: 15px;
        }

    </style>

</head>

<body>


<div class="login-container">

    <div class="card login-card shadow p-4">

        <div class="text-center mb-4">

            <h2 class="fw-bold">
                RoadAI
            </h2>

            <p class="text-muted">
                Login to your account
            </p>

        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST"
              action="/login/">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter username"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>

            </div>


            <button type="submit"
                    class="btn btn-danger w-100">

                Login

            </button>

        </form>


        <div class="text-center mt-4">

            <p class="mb-0">
                Don't have an account?
                <a href="/register">
                    Register
                </a>
            </p>

        </div>


        <div class="text-center mt-3">

            <a href="/" class="text-decoration-none">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

</body>
</html>
