<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - RoadAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fa;
        }

        .register-container {
            min-height: 100vh;
            padding: 50px 0;
        }

        .register-card {
            max-width: 650px;
            margin: auto;
            border: none;
            border-radius: 15px;
        }

    </style>

</head>

<body>


<div class="register-container">

    <div class="container">

        <div class="card register-card shadow p-4">

            <div class="text-center mb-4">

                <h2 class="fw-bold">
                    Create Account
                </h2>

                <p class="text-muted">
                    Register for RoadAI
                </p>

            </div>


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST"
                  action="/register/">

                {% csrf_token %}


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Enter your name"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter email"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="tel"
                               name="phone"
                               class="form-control"
                               placeholder="Enter phone number"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Choose username"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Create password"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input type="password"
                               name="confirm_password"
                               class="form-control"
                               placeholder="Confirm password"
                               required>

                    </div>


                    <div class="col-12 mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea name="address"
                                  class="form-control"
                                  rows="3"
                                  placeholder="Enter your address"
                                  required></textarea>

                    </div>


                </div>


                <button type="submit"
                        class="btn btn-danger w-100">

                    Create Account

                </button>

            </form>


            <div class="text-center mt-4">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>


            <div class="text-center mt-3">

                <a href="/" class="text-decoration-none">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>


</body>
</html>
